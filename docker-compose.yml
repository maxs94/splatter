services:
  splatter:
    build: .
    ports:
      - "3000:3000"
    environment:
      BOTS: "3"        # default number of bots in a new lobby (the leader can change it)
      BOT_SKILL: "0.4" # 0 = hopeless, 1 = sharp
      WORKERS: "0"     # threads running the lobbies, 0 = one per CPU minus one
      # Secret for resetting players' passwords (in the menu: Log in > Reset a password).
      # Use a long random string (32+ characters); shorter switches the reset off.
      ADMIN_PASSWORD: ""
      PROFILE: "0"     # 1 = profile the server, reports go to ./profiles
      PROFILE_CPU: "0" # 1 = also record a CPU profile per match (open in Chrome DevTools)
    volumes:
      - ./profiles:/app/profiles
      - ./data:/app/data # accounts database (splatter.db)
    restart: unless-stopped
